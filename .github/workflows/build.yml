name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Manual Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
        env:
          HUSKY: '0'

      - name: Prisma generate
        run: pnpm --filter @cvstudio/api exec prisma generate

      - name: Build packages and apps
        run: >
          pnpm build
          --filter=@cvstudio/api
          --filter=@cvstudio/web
          --filter=@cvstudio/ui
          --filter=@cvstudio/shared-types
          --filter=@cvstudio/shared-utils
          --filter=@cvstudio/ai-service

      - name: Build web bundle check
        run: pnpm build:web
