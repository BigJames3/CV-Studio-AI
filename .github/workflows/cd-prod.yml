name: CD Production Blue-Green

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag already in ECR (sha-...)'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "sha=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name cvstudio-prod --region $AWS_REGION

      - name: Migrate (expand-safe)
        run: |
          # Job image updated to new tag then applied
          kubectl -n cvstudio delete job db-migrate --ignore-not-found
          kubectl apply -k infrastructure/k8s/overlays/prod
          kubectl -n cvstudio wait --for=condition=complete job/db-migrate --timeout=300s || true

      - name: Scale green & set image
        run: |
          REG="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com"
          TAG="${{ steps.tag.outputs.sha }}"
          kubectl -n cvstudio set image deploy/api-green api=$REG/cvstudio/api:$TAG
          kubectl -n cvstudio scale deploy/api-green --replicas=3
          kubectl -n cvstudio rollout status deploy/api-green --timeout=300s

      - name: Smoke green (port-forward or internal)
        run: |
          kubectl -n cvstudio port-forward deploy/api-green 8080:3001 &
          sleep 3
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready

      - name: Flip Service to green
        run: |
          kubectl -n cvstudio patch svc api -p '{"spec":{"selector":{"app":"api","version":"green"}}}'

      - name: Drain blue (delay)
        run: |
          sleep 120
          kubectl -n cvstudio scale deploy/api --replicas=0
          # Optionally rename green→blue in a follow-up stabilization job
