name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Lint · Typecheck · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvstudio
          POSTGRES_PASSWORD: cvstudio
          POSTGRES_DB: cvstudio_test
        options: >-
          --health-cmd "pg_isready -U cvstudio -d cvstudio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_test?schema=public
      DIRECT_DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!
      AUTH_RATE_LIMIT_DISABLED: 'true'
      CINETPAY_API_KEY: test_api_key
      CINETPAY_SITE_ID: test_site_id
      CINETPAY_FAIL_CLOSED: 'true'
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      PORT: '3001'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Prettier
        run: pnpm lint:fix

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma generate
        run: pnpm --filter @cvstudio/api exec prisma generate

      - name: Test
        run: pnpm test

      - name: Prisma migrate (API e2e)
        run: pnpm --filter @cvstudio/api exec prisma migrate deploy

      - name: API e2e (CinetPay + Stripe regression)
        run: pnpm --filter @cvstudio/api exec jest --config ./test/jest-e2e.json --runInBand --forceExit

      - name: Coverage gates (AI + payments + marketplace)
        run: >
          pnpm --filter @cvstudio/api exec jest --config jest.config.json --coverage
          --coverageReporters=text-summary --coverageReporters=json
          --testPathPattern="(ai|payments|marketplace)"
          --collectCoverageFrom="**/modules/ai/ai.service.ts"
          --collectCoverageFrom="**/modules/ai/ai-quota.service.ts"
          --collectCoverageFrom="**/modules/payments/payments.service.ts"
          --collectCoverageFrom="**/modules/marketplace/marketplace.service.ts"
          --forceExit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./apps/api/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvstudio
          POSTGRES_PASSWORD: cvstudio
          POSTGRES_DB: cvstudio_lh
        options: >-
          --health-cmd "pg_isready -U cvstudio -d cvstudio_lh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_lh?schema=public
      DIRECT_DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_lh?schema=public
      REDIS_URL: redis://localhost:6379/0
      PORT: '3001'
      JWT_ACCESS_SECRET: lh-access-secret-min-32-characters!!!!
      JWT_REFRESH_SECRET: lh-refresh-secret-min-32-characters!!!
      CORS_ORIGINS: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_RATE_LIMIT_DISABLED: 'true'
      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Prisma generate + migrate + seed
        run: |
          pnpm --filter @cvstudio/api exec prisma generate
          pnpm --filter @cvstudio/api exec prisma migrate deploy
          pnpm --filter @cvstudio/api exec prisma db seed

      - name: Build API + Web
        run: pnpm build --filter=@cvstudio/api --filter=@cvstudio/web --filter=@cvstudio/ui --filter=@cvstudio/shared-types --filter=@cvstudio/shared-utils --filter=@cvstudio/ai-service

      - name: Start API
        run: |
          nohup pnpm --filter @cvstudio/api exec node dist/main.js > /tmp/api-lh.log 2>&1 &
          echo $! > /tmp/api-lh.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API never became ready for Lighthouse"
          cat /tmp/api-lh.log || true
          exit 1

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

  e2e:
    name: E2E
    needs: [quality]
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build --filter=@cvstudio/api --filter=@cvstudio/web --filter=@cvstudio/ui --filter=@cvstudio/shared-types --filter=@cvstudio/shared-utils --filter=@cvstudio/ai-service

  deploy-staging:
    name: Deploy staging
    needs: [quality, lighthouse, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd-staging.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  deploy-prod:
    name: Deploy production
    needs: [quality, lighthouse, e2e, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/cd-prod.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
