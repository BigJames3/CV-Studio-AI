name: CI

on:
  pull_request:
    branches: [main, develop, staging, ci-cd-hardening]

  push:
    branches: [main, develop, staging, ci-cd-hardening]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principe least privilege :
# les jobs CI n'ont pas besoin d'OIDC.
# Les workflows de déploiement récupèrent id-token: write
# directement dans leurs propres permissions.
permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ============================================================
  # 1. QUALITY GATE
  # ============================================================
  quality:
    name: Lint · Typecheck · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvstudio
          POSTGRES_PASSWORD: cvstudio
          POSTGRES_DB: cvstudio_test
        options: >-
          --health-cmd "pg_isready -U cvstudio -d cvstudio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_test?schema=public
      DIRECT_DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!
      AUTH_RATE_LIMIT_DISABLED: 'true'
      CINETPAY_API_KEY: test_api_key
      CINETPAY_SITE_ID: test_site_id
      CINETPAY_FAIL_CLOSED: 'true'
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      PORT: '3001'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
        env:
          HUSKY: '0'

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Prisma generate
        run: pnpm --filter @cvstudio/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prisma migrate
        run: pnpm --filter @cvstudio/api exec prisma migrate deploy

      - name: API E2E
        run: >
          pnpm --filter @cvstudio/api exec jest
          --config ./test/jest-e2e.json
          --runInBand
          --forceExit

      - name: Coverage gates
        run: >
          pnpm --filter @cvstudio/api exec jest
          --config jest.config.json
          --coverage
          --coverageReporters=text-summary
          --coverageReporters=json
          --testPathPattern="(ai|payments|marketplace)"
          --collectCoverageFrom="**/modules/ai/ai.service.ts"
          --collectCoverageFrom="**/modules/ai/ai-quota.service.ts"
          --collectCoverageFrom="**/modules/payments/payments.service.ts"
          --collectCoverageFrom="**/modules/marketplace/marketplace.service.ts"
          --forceExit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./apps/api/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ============================================================
  # 2. BUILD
  #    Runs only after quality passes
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
        env:
          HUSKY: '0'

      - name: Prisma generate
        run: pnpm --filter @cvstudio/api exec prisma generate

      - name: Build packages and applications
        run: >
          pnpm build
          --filter=@cvstudio/api
          --filter=@cvstudio/web
          --filter=@cvstudio/ui
          --filter=@cvstudio/shared-types
          --filter=@cvstudio/shared-utils
          --filter=@cvstudio/ai-service

  # ============================================================
  # 3. E2E
  #    Runs only after quality passes
  # ============================================================
  e2e:
    name: E2E
    needs: [quality]
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  # ============================================================
  # 4. LIGHTHOUSE
  #    Runs only after quality passes
  # ============================================================
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvstudio
          POSTGRES_PASSWORD: cvstudio
          POSTGRES_DB: cvstudio_lh
        options: >-
          --health-cmd "pg_isready -U cvstudio -d cvstudio_lh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: development

      DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_lh?schema=public
      DIRECT_DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_lh?schema=public
      REDIS_URL: redis://localhost:6379/0

      PORT: '3001'

      JWT_ACCESS_SECRET: lh-access-secret-min-32-characters!!!!
      JWT_REFRESH_SECRET: lh-refresh-secret-min-32-characters!!!

      CORS_ORIGINS: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000

      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'

      AUTH_RATE_LIMIT_DISABLED: 'true'

      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # IMPORTANT:
      # Lighthouse doit pouvoir installer les devDependencies.
      # HUSKY=0 évite uniquement l'installation des hooks Git.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
        env:
          HUSKY: '0'

      - name: Prisma generate
        run: pnpm --filter @cvstudio/api exec prisma generate

      - name: Prisma migrate
        run: pnpm --filter @cvstudio/api exec prisma migrate deploy

      - name: Prisma seed
        run: pnpm --filter @cvstudio/api exec prisma db seed

      - name: Build API and Web
        env:
          NODE_ENV: production
        run: >
          pnpm build
          --filter=@cvstudio/api
          --filter=@cvstudio/web
          --filter=@cvstudio/ui
          --filter=@cvstudio/shared-types
          --filter=@cvstudio/shared-utils
          --filter=@cvstudio/ai-service

      # --------------------------------------------------------
      # Start API in production mode
      # --------------------------------------------------------
      - name: Start API
        env:
          NODE_ENV: production
        run: |
          nohup pnpm --filter @cvstudio/api exec node dist/main.js \
            > /tmp/api-lh.log 2>&1 &

          echo $! > /tmp/api-lh.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health/ready; then
              echo "API is ready"
              exit 0
            fi

            sleep 2
          done

          echo "API never became ready for Lighthouse"
          echo "===== API LOG ====="
          cat /tmp/api-lh.log || true

          exit 1

      # --------------------------------------------------------
      # Start Next.js production server
      # --------------------------------------------------------
      - name: Start Web
        env:
          NODE_ENV: production
          PORT: '3000'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup pnpm --filter @cvstudio/web exec next start \
            -p 3000 \
            > /tmp/web-lh.log 2>&1 &

          echo $! > /tmp/web-lh.pid

      - name: Wait for Web
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Web is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Web never became ready for Lighthouse"
          echo "===== WEB LOG ====="
          cat /tmp/web-lh.log || true

          echo "===== API LOG ====="
          cat /tmp/api-lh.log || true

          exit 1

      # --------------------------------------------------------
      # Lighthouse
      # --------------------------------------------------------
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      # --------------------------------------------------------
      # Diagnostics when Lighthouse fails
      # --------------------------------------------------------
      - name: Upload Lighthouse logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-logs
          path: |
            /tmp/api-lh.log
            /tmp/web-lh.log
          retention-days: 7

  # ============================================================
  # 5. STAGING DEPLOY
  #    Only after EVERYTHING is green
  # ============================================================
  deploy-staging:
    name: Deploy staging
    needs: [quality, build, e2e, lighthouse]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/cd-staging.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # ============================================================
  # 6. PRODUCTION DEPLOY
  #    Only from version tags and after EVERYTHING is green
  # ============================================================
  deploy-prod:
    name: Deploy production
    needs: [quality, build, e2e, lighthouse]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/cd-prod.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
