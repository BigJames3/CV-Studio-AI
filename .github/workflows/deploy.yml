name: Deploy to Production (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR image tag to deploy (sha-...). Must already exist from a green CI/staging build.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/cd-prod.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
