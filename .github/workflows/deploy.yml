name: Deploy to production (manual)

# Redeploy an image that already exists on GHCR (e.g. roll forward or back to a known build).
# The tag is the API image tag, sha-<12>; the matching web image is sha-<12>-prod.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag (sha-<12>) built by a green CI run'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      environment: production
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
