name: E2E Tests

on:
  workflow_call:
    inputs:
      stripe:
        description: 'Run Stripe hosted-checkout tests (needs secrets)'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      stripe:
        description: 'Run Stripe hosted-checkout tests (needs secrets)'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright payment flow
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvstudio
          POSTGRES_PASSWORD: cvstudio
          POSTGRES_DB: cvstudio_e2e
        options: >-
          --health-cmd "pg_isready -U cvstudio -d cvstudio_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      CI: true
      DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://cvstudio:cvstudio@localhost:5432/cvstudio_e2e?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: e2e-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: e2e-refresh-secret-min-32-characters!
      CORS_ORIGINS: http://localhost:3000
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      E2E_API_URL: http://localhost:3001/api/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      AUTH_RATE_LIMIT_DISABLED: 'true'
      CINETPAY_API_KEY: test_api_key
      CINETPAY_SITE_ID: test_site_id
      CINETPAY_FAIL_CLOSED: 'true'
      STRIPE_SECRET_KEY: ${{ inputs.stripe && secrets.E2E_STRIPE_SECRET_KEY || 'sk_test_xxx' }}
      STRIPE_WEBHOOK_SECRET: ${{ inputs.stripe && secrets.E2E_STRIPE_WEBHOOK_SECRET || 'whsec_xxx' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ inputs.stripe && secrets.E2E_STRIPE_PUBLISHABLE_KEY || 'pk_test_xxx' }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ inputs.stripe && secrets.E2E_STRIPE_PRICE_PRO_MONTHLY || '' }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ inputs.stripe && secrets.E2E_STRIPE_PRICE_BUSINESS_MONTHLY || '' }}
      E2E_STRIPE: ${{ inputs.stripe && '1' || '' }}
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: CV Studio AI <noreply@cvstudio.local>

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # GitHub Actions service containers are on localhost, not hostnames postgres/redis.
      - name: Wait for Postgres + Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-tools
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U cvstudio -d cvstudio_e2e && break
            echo "Waiting for postgres..."
            sleep 2
          done
          pg_isready -h 127.0.0.1 -p 5432 -U cvstudio -d cvstudio_e2e
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Write API + Web env files
        run: |
          umask 077
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}"
            echo "REDIS_URL=${REDIS_URL}"
            echo "PORT=3001"
            echo "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}"
            echo "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
            echo "CORS_ORIGINS=${CORS_ORIGINS}"
            echo "APP_URL=${APP_URL}"
            echo "AUTH_RATE_LIMIT_DISABLED=true"
            echo "CINETPAY_API_KEY=${CINETPAY_API_KEY}"
            echo "CINETPAY_SITE_ID=${CINETPAY_SITE_ID}"
            echo "CINETPAY_FAIL_CLOSED=${CINETPAY_FAIL_CLOSED}"
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
            echo "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}"
            echo "SMTP_HOST=${SMTP_HOST}"
            echo "SMTP_PORT=${SMTP_PORT}"
            echo "MAIL_FROM=${MAIL_FROM}"
          } > apps/api/.env
          {
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
            echo "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}"
            echo "PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL}"
            echo "E2E_API_URL=${E2E_API_URL}"
          } > apps/web/.env.local

      - name: Prisma generate + migrate + seed
        run: |
          pnpm --filter @cvstudio/api exec prisma generate
          pnpm --filter @cvstudio/api exec prisma migrate deploy
          pnpm --filter @cvstudio/api exec prisma db seed

      - name: Build API + Web
        run: pnpm build --filter=@cvstudio/api --filter=@cvstudio/web --filter=@cvstudio/ui --filter=@cvstudio/shared-types --filter=@cvstudio/shared-utils --filter=@cvstudio/ai-service

      - name: Install Playwright Chromium
        run: pnpm --filter @cvstudio/web exec playwright install --with-deps chromium

      # Playwright webServer starts API (dist/main.js) and Next (next start). Do not also npm start &.
      - name: Run E2E
        run: pnpm --filter @cvstudio/web test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

      - name: Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skip"
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"E2E failed on ${GITHUB_REF} (${GITHUB_SHA::7}) — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
