name: Kubernetes manifests

# Render every kustomize overlay and validate it against the Kubernetes schemas, so a broken
# manifest fails on the PR instead of during a deploy.

on:
  pull_request:
    paths:
      - 'infrastructure/k8s/**'
      - '.github/workflows/k8s-manifests.yml'

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7

jobs:
  validate:
    name: Validate (${{ matrix.overlay }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        overlay: [staging, prod, dev]
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLo kubeconform.tar.gz "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo CHECKSUMS "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sed 's/kubeconform-linux-amd64.tar.gz/kubeconform.tar.gz/' | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
      - name: Render
        run: kubectl kustomize infrastructure/k8s/overlays/${{ matrix.overlay }} > rendered.yaml
      - name: Validate
        run: ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
