name: Terraform (OVHcloud)

# PR: format + validate both environments, no credentials needed.
# Manual run: plan (and optionally apply) one environment, behind the approval of the
# `terraform-staging` / `terraform-prod` GitHub environment. Nothing is applied on push.

on:
  pull_request:
    paths:
      - 'infrastructure/terraform-ovh/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        type: choice
        options: [staging, prod]
      action:
        description: 'plan only, or plan then apply that exact plan'
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: 'true'

jobs:
  validate:
    name: Validate (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, prod]
    defaults:
      run:
        working-directory: infrastructure/terraform-ovh/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Fmt
        run: terraform fmt -check -recursive ../..
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  plan-apply:
    name: ${{ inputs.action }} ${{ inputs.env }}
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: terraform-${{ inputs.env }}
    concurrency:
      # No state locking on Object Storage: never run two jobs on the same state.
      group: terraform-${{ inputs.env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infrastructure/terraform-ovh/envs/${{ inputs.env }}
    env:
      OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      TF_VAR_ovh_cloud_project_id: ${{ secrets.OVH_CLOUD_PROJECT_ID }}
      # S3 credentials of the OVHcloud Object Storage user that holds the state.
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.env }}/terraform.tfstate" \
            -backend-config="region=gra" \
            -backend-config='endpoints={s3="https://s3.gra.io.cloud.ovh.net"}' \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -no-color tfplan
