name: Terraform

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: infrastructure/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TF }}
          aws-region: eu-west-1
        continue-on-error: true
      - name: Fmt
        run: terraform fmt -check -recursive ../..
        continue-on-error: true
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -no-color -input=false || true
        # Real plan requires backend credentials + vars

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    environment: terraform-prod
    defaults:
      run:
        working-directory: infrastructure/terraform/envs/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TF }}
          aws-region: eu-west-1
      - name: Apply staging (gated)
        run: |
          terraform init
          terraform apply -auto-approve
        continue-on-error: true
