apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cvstudio
  labels:
    app: api
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
      version: blue
  template:
    metadata:
      labels:
        app: api
        version: blue
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: api
      # Spread replicas over zones and nodes so one zone or node going down keeps the API up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      # The image declares `USER app` by name: without a numeric runAsUser the kubelet cannot
      # check runAsNonRoot and refuses to start the container. 10001 is `app` in the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 000000000000.dkr.ecr.eu-west-1.amazonaws.com/cvstudio/api:sha-replace
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
            # Prometheus metrics: not in the Service or the Ingress, scraped on the pod IP.
            - containerPort: 9464
              name: metrics
          envFrom:
            - secretRef:
                name: api-secrets
          env:
            - name: STRIPE_FAIL_CLOSED
              value: '1'
            # Chromium work goes to the worker-pdf Deployment (inline fallback if none is up).
            - name: PDF_RENDER_MODE
              value: queue
            # One JSON object per line: Fluent Bit (Merge_Log) indexes level, status, requestId...
            - name: LOG_FORMAT
              value: json
          # Readiness checks Postgres (2 s cap in the API): a pod that loses the DB leaves the Service.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness never touches a dependency: a DB failover must not restart every pod.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          # readOnlyRootFilesystem: Chromium (inline PDF fallback) and Node need a writable /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 10']
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cvstudio
spec:
  selector:
    app: api
    version: blue
  ports:
    - port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: cvstudio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
