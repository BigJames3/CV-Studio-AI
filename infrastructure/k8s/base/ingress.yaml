# ingress-nginx behind the OVHcloud Load Balancer, TLS from cert-manager (Let's Encrypt).
# Production hosts here; the staging overlay replaces them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cvstudio
  namespace: cvstudio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # The API accepts bodies up to 1.5 MB (main.ts).
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.cvstudio.ai
        - cvstudio.ai
      secretName: cvstudio-tls
  rules:
    - host: api.cvstudio.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
    - host: cvstudio.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
