apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cvstudio
resources:
  - namespace.yaml
  - api.yaml
  - blue-green-api.yaml
  - web.yaml
  - ingress.yaml
  - stripe-webhook-retry-cronjob.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: cvstudio
# Placeholder image names, mapped to GHCR by each overlay; the deploy workflow sets the tag.
images:
  - name: cvstudio-api
    newName: ghcr.io/bigjames3/cvstudio-api
    newTag: replace-me
  - name: cvstudio-web
    newName: ghcr.io/bigjames3/cvstudio-web
    newTag: replace-me
