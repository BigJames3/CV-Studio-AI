apiVersion: batch/v1
kind: CronJob
metadata:
  name: stripe-webhook-retry
  namespace: cvstudio
  labels:
    app.kubernetes.io/name: stripe-webhook-retry
    app.kubernetes.io/part-of: cvstudio
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: webhook-retry
              # Same image and tag as the API (set by kustomize), never an untagged :latest.
              image: cvstudio-api
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: api-secrets
              env:
                - name: NODE_ENV
                  value: production
                - name: STRIPE_FAIL_CLOSED
                  value: '1'
                - name: WEBHOOK_DLQ_RETRY_LIMIT
                  value: '50'
              # `command` replaces the image entrypoint, so no migration runs every 5 minutes.
              command: ['node', 'dist/scripts/retry-webhook-dlq.js']
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
