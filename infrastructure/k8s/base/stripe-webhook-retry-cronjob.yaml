apiVersion: batch/v1
kind: CronJob
metadata:
  name: stripe-webhook-retry
  namespace: cvstudio
  labels:
    app.kubernetes.io/name: stripe-webhook-retry
    app.kubernetes.io/part-of: cvstudio
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: webhook-retry
              # Same image and tag as the API: the overlays / CD set the tag of this placeholder.
              image: 000000000000.dkr.ecr.eu-west-1.amazonaws.com/cvstudio/api:sha-replace
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: api-secrets
              env:
                - name: NODE_ENV
                  value: production
                - name: STRIPE_FAIL_CLOSED
                  value: '1'
                - name: WEBHOOK_DLQ_RETRY_LIMIT
                  value: '50'
              command: ['node', 'dist/scripts/retry-webhook-dlq.js']
