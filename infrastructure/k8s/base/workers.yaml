apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pdf
  namespace: cvstudio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-pdf
  template:
    metadata:
      labels:
        app: worker-pdf
    spec:
      nodeSelector:
        workload: workers
      containers:
        - name: worker
          image: 000000000000.dkr.ecr.eu-west-1.amazonaws.com/cvstudio/worker:sha-replace
          env:
            - name: WORKER_KIND
              value: pdf
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
