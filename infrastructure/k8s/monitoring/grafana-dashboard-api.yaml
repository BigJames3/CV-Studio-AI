# Grafana dashboard loaded by the kube-prometheus-stack sidecar (label grafana_dashboard: "1").
#   kubectl apply -f infrastructure/k8s/monitoring/grafana-dashboard-api.yaml
# Uses the recording rules of prometheus-rules.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cvstudio-api
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  cvstudio-api.json: |
    {
      "title": "CV Studio — API golden signals",
      "uid": "cvstudio-api",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "cvstudio"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Requests / s by status class",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (label_replace(rate(http_request_duration_seconds_count{app=\"api\"}[5m]), \"code\", \"${1}xx\", \"status\", \"(.)..\"))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx ratio (SLO 99.9% → budget 0.1%)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cvstudio:api_error_ratio:rate5m",
              "legendFormat": "5m"
            },
            {
              "refId": "B",
              "expr": "cvstudio:api_error_ratio:rate1h",
              "legendFormat": "1h"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency, interactive routes (target < 500 ms)",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cvstudio:api_latency_p95:rate5m",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Slowest routes (p95)",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(8, histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket{app=\"api\",route!=\"unmatched\"}[5m]))))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "PDF render p95 by where",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, where) (rate(pdf_render_duration_seconds_bucket[5m])))",
              "legendFormat": "{{where}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "PDF queue",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (state) (pdf_render_queue_jobs{state=~\"waiting|active|failed\"})",
              "legendFormat": "{{state}}"
            },
            {
              "refId": "B",
              "expr": "max(pdf_render_workers)",
              "legendFormat": "workers"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Resident memory by pod",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{app=~\"api|worker-pdf\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Event loop lag p99 by pod",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nodejs_eventloop_lag_p99_seconds{app=~\"api|worker-pdf\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
